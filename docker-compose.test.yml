# Dedicated ephemeral services for backend integration tests.
services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: backend_test
      POSTGRES_PASSWORD: backend_test
      POSTGRES_DB: backend_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_test -d backend_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
